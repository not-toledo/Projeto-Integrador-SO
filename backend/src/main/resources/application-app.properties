# Versao instalada do NEXCORE (perfil "app", ativado pelo NEXCORE.exe / NexcoreLauncher). Nao vale no desenvolvimento.
# Porta propria, para nao colidir com 8080 (comum em outros programas). O usuario pode trocar no arquivo abaixo.
server.port=47820
# Leitor de sensores que acompanha a instalacao (o launcher informa o caminho).
nexcore.sensors.host-path=${nexcore.app.sensor-host:}
# Configuracao do usuario (%LOCALAPPDATA%\NEXCORE\config\nexcore.properties): tem prioridade sobre este arquivo e
# nunca e alterada por atualizacoes.
spring.config.import=optional:file:${nexcore.app.config}
# Log em arquivo (sem janela de terminal na versao instalada).
logging.file.name=${nexcore.app.home}/logs/nexcore.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5

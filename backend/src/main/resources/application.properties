spring.application.name=pccheck-backend
# Segurança: escutar somente em localhost (sem acesso remoto).
server.address=127.0.0.1
server.port=8080

# Health Check (Módulo B): limites configuráveis. Padrões genéricos do projeto, NÃO limites oficiais do fabricante.
# Temperatura da CPU (°C): atenção e crítico.
pccheck.health.cpu-temp-warning-c=80
pccheck.health.cpu-temp-critical-c=95
# Espaço livre por volume (%): abaixo de atenção / abaixo de crítico.
pccheck.health.disk-free-warning-percent=15
pccheck.health.disk-free-critical-percent=5
# Uso de RAM (%): a partir daqui, aviso de uso elevado (não é defeito).
pccheck.health.ram-used-warning-percent=85
# Historico da coleta agendada (scripts/agendar-coleta). Vazio: PCCHECK_DATA_DIR ou o padrao do SO
# (%LOCALAPPDATA%\PCCheck no Windows; ~/.local/state/pccheck no Linux).
pccheck.history.data-dir=
# Pressao de memoria (heuristicas do projeto, nao limites oficiais do SO):
# memoria comprometida (% do limite RAM + paginacao) a partir da qual ha aviso (so Windows).
pccheck.health.memory-pressure.commit-warning-percent=90
# Media de paginas gravadas em disco (bytes/s) que, com RAM acima do limite de aviso, caracteriza paginacao constante.
pccheck.health.memory-pressure.page-out-warning-bytes-per-sec=1048576
# Amostras do Live Monitor usadas na media (30 x 2 s = ~1 min) e minimo para avaliar.
pccheck.health.memory-pressure.window-samples=30
pccheck.health.memory-pressure.min-samples=10

# Live Monitor (Módulo C): coleta periódica em segundo plano.
# Intervalo entre coletas (ms, mínimo 500). Aumente para reduzir o consumo de CPU.
pccheck.monitor.interval-ms=2000
# Máximo de amostras mantidas em memória (10 a 3600); com 2 s, 300 amostras = 10 minutos.
pccheck.monitor.history-size=300

# GPU e sensores (temperatura da CPU, ventoinhas, GPU): leitor de sensores do PCCheck (pasta sensor-host),
# iniciado automaticamente pelo backend; o usuario nao abre nenhum outro programa.
# Liga/desliga a leitura de sensores.
pccheck.sensors.enabled=true
# Pede permissao de administrador ao Windows ao iniciar (necessaria para temperatura da CPU e ventoinhas).
# Se o usuario recusar, GPU continua com leitura e CPU/ventoinhas ficam "Sem leitura" com a explicacao.
pccheck.sensors.elevate=true
# Caminho do PCCheck.SensorHost.exe. Em branco: procura em sensor-host/dist/ (pasta atual ou a de cima).
pccheck.sensors.host-path=

# Logs: o OSHI registra um WARN a cada coleta quando o Windows nao expoe o sensor de temperatura
# (MSAcpi_ThermalZoneTemperature). Isso e esperado em muitos computadores e a interface ja mostra "Sem leitura";
# o nivel ERROR evita poluir o terminal. Remova esta linha para voltar a ver os avisos do OSHI.
logging.level.oshi.util.platform.windows.WmiQueryHandler=ERROR

# Game Compatibility (Módulo D): consulta pública à Steam Store feita pelo backend (nenhum dado do PC é enviado).
# Os endpoints da loja não são uma API oficial garantida: por isso há timeout, cache e tratamento de falhas.
# Região e idioma dos resultados (país com 2 letras minúsculas; idioma da Steam, ex.: brazilian, english).
pccheck.steam.country=br
pccheck.steam.language=brazilian
# Timeouts de conexão e de leitura (ms) e duração do cache das pesquisas (s).
pccheck.steam.connect-timeout-ms=5000
pccheck.steam.read-timeout-ms=8000
pccheck.steam.search-cache-seconds=300
